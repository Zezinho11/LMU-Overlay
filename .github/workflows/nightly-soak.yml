name: Nightly soak

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Soak duration in seconds"
        required: true
        default: "3600"

permissions:
  contents: read

jobs:
  telemetry-and-presentation:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Desktop and SteamVR parity gate
        run: dotnet run --no-build --configuration Release --project tests/LmuOverlay.PresentationParity.Tests
      - name: Long telemetry cadence, allocation and leak gate
        shell: pwsh
        run: |
          $duration = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.duration_seconds }}"
          } else {
            "3600"
          }
          dotnet run --no-build --configuration Release --project tools/LmuOverlay.SoakTest -- `
            --duration-seconds $duration `
            --max-working-set-growth-mb 64
