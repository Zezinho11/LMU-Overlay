name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix"
        required: true
        default: "0.1.0"

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet run --no-build --configuration Release --project tests/LmuOverlay.Core.Tests
      - run: dotnet run --no-build --configuration Release --project tests/LmuOverlay.Desktop.Tests
      - run: dotnet run --no-build --configuration Release --project tests/LmuOverlay.Domain.Tests
      - run: dotnet run --no-build --configuration Release --project tests/LmuOverlay.LmuSharedMemory.Tests
      - run: dotnet run --no-build --configuration Release --project tests/LmuOverlay.Widgets.Tests
      - run: dotnet run --no-build --configuration Release --project tests/LmuOverlay.SteamVr.Tests
      - run: dotnet run --no-build --configuration Release --project tests/LmuOverlay.PresentationParity.Tests
      - name: Short telemetry soak gate
        run: dotnet run --no-build --configuration Release --project tools/LmuOverlay.SoakTest -- --duration-seconds 5
      - name: Package portable Windows release
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version "${{ steps.version.outputs.value }}"
      - name: Generate package SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: artifacts/LMU-Overlay-${{ steps.version.outputs.value }}-win-x64
          format: spdx-json
          output-file: artifacts/LMU-Overlay-${{ steps.version.outputs.value }}-win-x64.spdx.json
          artifact-name: LMU-Overlay-${{ steps.version.outputs.value }}-SBOM.spdx.json
          dependency-snapshot: true
          upload-artifact: false
          upload-release-assets: false
      - name: Attest package provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: artifacts/LMU-Overlay-${{ steps.version.outputs.value }}-win-x64.zip
      - name: Attest package SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: artifacts/LMU-Overlay-${{ steps.version.outputs.value }}-win-x64.zip
          sbom-path: artifacts/LMU-Overlay-${{ steps.version.outputs.value }}-win-x64.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: LMU-Overlay-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.spdx.json
            artifacts/latest.json
      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.spdx.json
            artifacts/latest.json
